# GTEx v8 全血用。帰属検証（結果 4）の RNA-seq 再現に使う。
# 摂動条件がないコホートなので、条件効果・順位一貫性・ICC は測らない。
# 測るのは「主成分を何が説明するか」と「雑音軸を抜いたあとの内部整合性」だけ。

seed: 20260803

donor_split:
  discovery_fraction: 0.5
  stratify_by: null
  n_splits: 1

conditions:
  resting: muscle
  perturbed: []
  cross_perturbation_pair: []

preprocessing:
  quantification: tmm_logcpm     # GSE81046 と同じ経路に揃える
  probe_collapse: max_mean
  expression_filter:
    method: detected
    min_value: 1.0               # CPM >= 1
    min_fraction: 0.5
  cross_sample_normalization: none
  min_individuals: 50

metrics:
  internal_consistency:
    method: spearman
    split_half_repeats: 50
    use_condition: muscle
  negative_control:
    # 内部整合性の対照数。経験 p の下限は 1/(B+1) なので、B=20 では 0.048 にしかならず
    # 数千セットに BH-FDR をかけられない（そのため旧版は正規近似の p を使っていた）。
    # 平均ペア Spearman の帰無分布は有界で右に歪む（歪度の中位数 0.99）ため、
    # 正規近似は右裾で甘い側に外れる。B=10,000 にして経験 p のまま FDR をかける。
    n_sets_per_size: 10000
    # split-half の対照は平均値を出すためだけに使うので少数で足りる。
    # ここを 10,000 にすると split-half が 1 セットあたり 100,000 回になり終わらない。
    n_sets_split_half: 20
    match_on: [size, mean_expression_decile]

multiple_testing:
  method: fdr_bh
  alpha: 0.05

# 主成分の説明要因として比べるもの
attribution:
  technical: [SMRIN, SMTSISCH, SMGEBTCH, SMNABTCH, SMCENTER]
  biological: [AGE, SEX, DTHHRDY]
  # 組成の代理は組織固有にする。全血の血球マーカーを骨格筋に使っても意味がない。
  # 骨格筋の主要構成要素（筋線維・衛星細胞・脂肪・血管・線維芽・マクロファージ）を選んだ。
  # なお技術要因と生物学要因は列名が全組織で共通なので、組織をまたいだ比較は
  # そちら（虚血時間・RIN・バッチ・採取施設 / 年齢・性別・死因）で行う。
  composition_label: 細胞組成
  composition_sets: ["celltype|Myocytes", "celltype|Satellite Cells",
                     "celltype|Adipocytes", "celltype|Endothelial Cells",
                     "celltype|Fibroblasts", "celltype|Macrophages"]
  n_permutations: 200
  n_pcs: 5

output:
  tables: results/tables/gtex_muscle
  figures: results/figures/gtex_muscle
  figure_format: [png, svg]
  dpi: 200
